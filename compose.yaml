services:
  db:
    build: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitoreo_inteligente_cultivos}
      POSTGRES_USER: ${POSTGRES_USER:-invernadero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invernadero_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  preparar-red:
    build: ./database
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-monitoreo_inteligente_cultivos}
      PGUSER: ${POSTGRES_USER:-invernadero}
      PGPASSWORD: ${POSTGRES_PASSWORD:-invernadero_local}
    entrypoint: ["psql"]
    command:
      - "-X"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-f"
      - "/docker-entrypoint-initdb.d/02-catalogos.sql"
      - "-f"
      - "/docker-entrypoint-initdb.d/04-red.sql"
    restart: "no"

  medidor:
    build: ./java
    restart: unless-stopped
    depends_on:
      preparar-red:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-monitoreo_inteligente_cultivos}
      POSTGRES_USER: ${POSTGRES_USER:-invernadero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invernadero_local}

volumes:
  postgres_data:
