services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: monitoreo_inteligente_cultivos
      POSTGRES_USER: invernadero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invernadero_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
